    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Noto Serif SC"', '"Songti SC"', 'serif'],
              sans: ['"Inter"', '"system-ui"', 'sans-serif'],
              calligraphy: ['"Ma Shan Zheng"', '"Xingkai SC"', '"STXingkai"', 'cursive'],
            },
            colors: {
              // Rice Paper / Warm White (Base)
              stone: {
                50: '#fdfcfb', 
                100: '#f7f5f2',
                200: '#efece6',
                300: '#e0dbd1',
                400: '#d2cabd',
                500: '#a89f91',
                600: '#8c8375',
                700: '#5c564c',
                800: '#454039',
                900: '#292524',
              },
              // Spring Breeze / Celadon (Low Saturation, Airy Green)
              zen: {
                50: '#f5f8f7',
                100: '#e8efec',
                200: '#d3e0db',
                300: '#b4c9c1',
                400: '#91aca1',
                500: '#739086', // Main Sage Green
                600: '#5a756b',
                700: '#485e56',
                800: '#3d4d47',
                900: '#333f3b',
              },
              // Muted Wood / Dried Bamboo (Accent)
              wood: {
                50: '#f9f8f4',
                100: '#f0ece3',
                200: '#e0d6c3',
                300: '#cbbba0',
                400: '#b69e78',
                500: '#9f865d',
                600: '#806946',
                700: '#635036',
              }
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'fade-in': 'fadeIn 0.8s ease-out forwards',
              'slide-up': 'slideUp 0.6s ease-out forwards',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
